<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Reservation Hotel Room</title>
        <link rel="stylesheet" type="text/css" href="style.css"/>
    </head>
    <body>

        <h1>Reservation Hotel Room</h1>

        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td colspan="2"><strong>Personal Data</strong></td>
                </tr>
                <tr>
                    <td><label for="name"><strong>1. Name</strong></label></td>
                    <td><input type="text" id="name" name="name" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="gender"><strong>2. Gender</strong></label></td>
                    <td><input type="text" id="gender" name="gender" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="email"><strong>3. Email Address</strong></label></td>
                    <td><input type="text" id="email" name="email" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="phonenum"><strong>4. Telp Number</strong></label></td>
                    <td><input type="text" id="phonenum" name="phonenum" size="30" /></td>
                </tr>
                
                <tr>
                    <td colspan="2"><strong>Reservation Room</strong></td>
                </tr>
                <tr>
                    <td><label for="resname"><strong>1. Reservation Name</strong></label></td>
                    <td><input type="text" id="resname" name="resname" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="bookdate"><strong>2. Booking Date</strong></label></td>
                    <td><input type="text" id="bookdate" name="bookdate" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="room"><strong>3. Room Type</strong></label></td>
                    <td>
                        <select id="room" name="room">
                            <option>Regular</option>
                            <option>Deluxe</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="bed"><strong>4. Bed Type</strong></label></td>
                    <td>
                        <select id="bed" name="bed">
                            <option>Single Bed</option>
                            <option>Double Bed</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><strong>5. Breakfast</strong></td>
                    <td>
                        <input type="radio" id="with" name="jk" value="With Breakfast" />
                        <label for="with">With Breakfast</label>
                        <input type="radio" id="without" name="jk" value="Without Breakfast" />
                        <label for="without">Without Breakfast</label>
                    </td>
                </tr>
                
                <tr>
                    <td colspan="2"><strong>Payment</strong></td>
                </tr>
                <tr>
                    <td><label for="indate"><strong>1. Check In Date</strong></label></td>
                    <td><input type="text" id="indate" name="indate" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="outdate"><strong>2. Check Out Date</strong></label></td>
                    <td><input type="text" id="outdate" name="outdate" size="30" /></td>
                </tr>

                <tr>
                    <td><label for="pay"><strong>3. Payment Method</strong></label></td>
                    <td>
                        <select id="pay" name="pay">
                            <option>Cash</option>
                            <option>Transfer</option>
                            <option>QRIS</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="simpan" value="Simpan" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
